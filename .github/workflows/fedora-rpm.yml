name: Fedora RPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build Fedora 44 RPM (x86_64)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install RPM build tools
        run: dnf install -y git-core rpm-build tar gzip gh

      - name: Check out release source
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev(\.[0-9]+)?)?$ ]]
          version="${tag_version/-/~}"
          top=/tmp/deadband-rpmbuild
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "top=$top" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        env:
          RPM_VERSION: ${{ steps.release.outputs.version }}
          RPM_TOP: ${{ steps.release.outputs.top }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" --exclude-vcs \
            --transform="s|^\./|deadband-${RPM_VERSION}/|" \
            --transform="s|^\.$|deadband-${RPM_VERSION}|" \
            -czf "$RPM_TOP/SOURCES/deadband-${RPM_VERSION}.tar.gz" .

      - name: Stage RPM spec
        env:
          RPM_TOP: ${{ steps.release.outputs.top }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/packaging/rpm/deadband.spec" "$RPM_TOP/SPECS/"

      - name: Build RPM package
        env:
          RPM_VERSION: ${{ steps.release.outputs.version }}
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: |
          set -euo pipefail
          rpmbuild -ba "$RPM_TOP/SPECS/deadband.spec" \
            --define "_topdir $RPM_TOP" --define "app_version $RPM_VERSION"

      - name: Stage RPM artifact
        env:
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$RPM_TOP/RPMS/noarch/"*.rpm dist/

      - name: Publish RPM on GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          release_args=(--verify-tag --generate-notes --title "Deadband $tag")
          if [[ "$tag" == *-dev* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$tag" "${release_args[@]}" dist/*.rpm
