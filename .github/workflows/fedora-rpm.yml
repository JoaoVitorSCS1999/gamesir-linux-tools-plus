name: Linux packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and attach artifacts to
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-metadata:
    name: Resolve release versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      deb_version: ${{ steps.release.outputs.deb_version }}
      arch_version: ${{ steps.release.outputs.arch_version }}
    steps:
      - name: Parse release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tag_version="${tag#v}"
          if [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-dev(\.([0-9]+))?)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            if [[ "$tag_version" == *-dev* ]]; then
              deb_version="${version}~dev${BASH_REMATCH[4]:-0}"
              arch_version="${version}.dev${BASH_REMATCH[4]:-0}"
            else
              deb_version="$version"
              arch_version="$version"
            fi
          else
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_version=$deb_version" >> "$GITHUB_OUTPUT"
          echo "arch_version=$arch_version" >> "$GITHUB_OUTPUT"

  build-rpm:
    name: Build Fedora 44 RPM (x86_64)
    runs-on: ubuntu-latest
    container: fedora:44
    needs: release-metadata
    steps:
      - name: Install RPM build tools
        run: dnf install -y git-core rpm-build tar gzip
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}
          path: release-source
      - name: Prepare RPM metadata
        id: release
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-dev(\.([0-9]+))?)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            if [[ "$tag_version" == *-dev* ]]; then
              release="0.${BASH_REMATCH[4]:-0}.dev"
            else
              release=1
            fi
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          top=/tmp/deadband-rpmbuild
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "top=$top" >> "$GITHUB_OUTPUT"
      - name: Create source archive
        env:
          RPM_VERSION: ${{ steps.release.outputs.version }}
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE/release-source" --exclude-vcs \
            --transform="s|^\./|deadband-${RPM_VERSION}/|" \
            --transform="s|^\.$|deadband-${RPM_VERSION}|" \
            -czf "$RPM_TOP/SOURCES/deadband-${RPM_VERSION}.tar.gz" .
      - name: Stage RPM spec
        env:
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: cp "$GITHUB_WORKSPACE/builder/packaging/rpm/deadband.spec" "$RPM_TOP/SPECS/"
      - name: Build RPM package
        env:
          RPM_VERSION: ${{ steps.release.outputs.version }}
          RPM_RELEASE: ${{ steps.release.outputs.release }}
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: |
          rpmbuild -ba "$RPM_TOP/SPECS/deadband.spec" \
            --define "_topdir $RPM_TOP" \
            --define "app_version $RPM_VERSION" \
            --define "app_release $RPM_RELEASE"
      - name: Stage RPM artifact
        env:
          RPM_TOP: ${{ steps.release.outputs.top }}
        run: |
          mkdir -p dist
          cp "$RPM_TOP/RPMS/noarch/"*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    needs: release-metadata
    steps:
      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends bash ca-certificates dpkg-dev git
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}
          path: release-source
      - name: Build .deb
        env:
          VERSION: ${{ needs.release-metadata.outputs.deb_version }}
        run: bash builder/packaging/deb/build.sh "$VERSION" dist release-source
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  build-arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    needs: release-metadata
    steps:
      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm --needed git
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}
          path: release-source
      - name: Build .pkg.tar.zst
        env:
          DEADBAND_VERSION: ${{ needs.release-metadata.outputs.arch_version }}
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd builder/packaging/arch
          install -d -o builder -g builder "$GITHUB_WORKSPACE/dist"
          runuser -u builder -- env DEADBAND_VERSION="$DEADBAND_VERSION" DEADBAND_SOURCE_DIR="$GITHUB_WORKSPACE/release-source" makepkg --noconfirm --nodeps --skipinteg
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  build-appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04
    needs: release-metadata
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}
          path: release-source
      - name: Install AppImage build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file wget desktop-file-utils squashfs-tools
      - name: Download AppImage tools
        run: |
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-conda/master/linuxdeploy-plugin-conda.sh -O linuxdeploy-plugin-conda
          chmod +x linuxdeploy-plugin-conda
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
      - name: Build AppImage
        env:
          CONDA_PYTHON_VERSION: '3.12'
          CONDA_PACKAGES: python=3.12;pyside6;hidapi;libusb
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          appdir="$GITHUB_WORKSPACE/AppDir"
          mkdir -p "$appdir"
          ./linuxdeploy-plugin-conda --appdir "$appdir"

          install -d "$appdir/usr/src/deadband" "$appdir/usr/bin"
          tar -C release-source --exclude-vcs -cf - . | tar -C "$appdir/usr/src/deadband" -xf -

          cat > "$appdir/usr/bin/deadband" <<'EOF'
          #!/bin/sh
          set -eu
          APPDIR="${APPDIR:-$(CDPATH= cd -- "$(dirname -- "$0")/../.." && pwd)}"
          exec "$APPDIR/usr/conda/bin/python" "$APPDIR/usr/src/deadband/deadband.py" "$@"
          EOF
          chmod 0755 "$appdir/usr/bin/deadband"

          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          set -eu
          APPDIR="${APPDIR:-$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)}"
          export PATH="$APPDIR/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$APPDIR/usr/conda/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for qt_plugins in "$APPDIR/usr/conda/plugins" "$APPDIR/usr/conda/lib/qt6/plugins" "$APPDIR/usr/conda/lib/qt/plugins"; do
              if [ -d "$qt_plugins/platforms" ]; then
                  export QT_PLUGIN_PATH="$qt_plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"
                  break
              fi
          done
          for qml_modules in "$APPDIR/usr/conda/qml" "$APPDIR/usr/conda/lib/qt6/qml" "$APPDIR/usr/conda/lib/qt/qml"; do
              if [ -d "$qml_modules" ]; then
                  export QML2_IMPORT_PATH="$qml_modules${QML2_IMPORT_PATH:+:$QML2_IMPORT_PATH}"
                  break
              fi
          done
          exec "$APPDIR/usr/bin/deadband" "$@"
          EOF
          chmod 0755 "$appdir/AppRun"

          sed 's/^Exec=deadband$/Exec=AppRun/' release-source/packaging/deadband.desktop > "$appdir/deadband.desktop"
          install -m 0644 release-source/assets/icon.png "$appdir/deadband.png"
          install -m 0644 release-source/LICENSE "$appdir/LICENSE"

          mkdir -p dist
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          ./appimagetool.AppImage "$appdir" \
            "dist/Deadband-${{ needs.release-metadata.outputs.version }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  publish-release-assets:
    name: Attach Linux packages to release
    runs-on: ubuntu-latest
    needs: [release-metadata, build-rpm, build-deb, build-arch, build-appimage]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: JoaoVitorSCS1999/gamesir-linux-tools-plus
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(--verify-tag --generate-notes --title "Deadband $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-dev* ]]; then
              release_args+=(--prerelease)
            else
              release_args+=(--latest)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}" dist/*
          fi
          if [[ "$RELEASE_TAG" != *-dev* ]]; then
            gh release edit "$RELEASE_TAG" --latest
          fi
